<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Mini Store</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>🛍️ ShopEase</h1>
        <p>Your favourite products, all in one place!</p>
        <button id="view-cart">🛒 Cart (<span id="cart-count">0</span>)</button>
    </header>

    <main>
        <section class="welcome">
            <h2>Discover Our Products</h2>
            <p>Choose your favourite products and add them to your cart.</p>
        </section>

        <section id="products" class="products-grid"></section>

        <section id="cart-section" class="cart-section">
            <h2>Your Shopping Cart</h2>
            <div id="cart-items"></div>

            <div class="cart-total">
                <h3>Total: ₹<span id="cart-total">0</span></h3>
                <button id="checkout-btn">Proceed to Checkout</button>
            </div>
        </section>
    </main>

    <div id="checkout-modal" class="modal">
        <div class="modal-content">
            <button id="close-modal" class="close-btn" aria-label="Close">&times;</button>
            <h2>Checkout Preview</h2>
            <div id="checkout-details"></div>
            <p class="notice">This is a demo checkout. No real payment will be made.</p>
            <button id="confirm-btn">Confirm Demo Order</button>
        </div>
    </div>

    <footer>
        <p>© 2026 ShopEase | Mini E-Commerce Project</p>
    </footer>

</body>
</html>
